[package]
name = "trailsense-device-tests"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
critical-section = "1.2.0"
embassy-executor = "0.9.1"
embassy-time = "0.5.0"
esp-alloc = "0.9.0"
esp-backtrace = { version = "0.18.1", features = ["esp32", "panic-handler", "println"] }
esp-bootloader-esp-idf = { version = "0.4.0", features = ["esp32", "log-04"] }
esp-hal = { version = "~1.0", features = ["esp32", "log-04", "unstable"] }
esp-println = { version = "0.16.1", features = ["esp32", "log-04"] }
esp-rtos = { version = "0.2.0", features = ["esp-alloc", "esp32", "log-04", "embassy"] }
log = "0.4.27"
trailsense-edge = { path = "../../trailsense-edge", default-features = false, features = ["uplink-gsm"] }

[[bin]]
name = "modem_lifecycle_serial"
path = "src/bin/modem_lifecycle_serial.rs"
