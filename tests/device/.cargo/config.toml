[build]
target = "xtensa-esp32-none-elf"
rustflags = [
  "-C", "link-arg=-nostartfiles",
  "-Z", "stack-protector=all",
]

[env]
ESP_LOG = "info"
TRAILSENSE_API_URL = "https://api.trailsense.daugt.com"
TRAILSENSE_EDGE_ID = "71ec4873-944e-49c1-b7c4-4b856797715f"

[unstable]
build-std = ["alloc", "core"]
